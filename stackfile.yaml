name: socialscrape-app
resources:
  api:
    build:
      repo: https://github.com/vyctncao/socialscrape.git
      branch: main
      context: .
      dockerfile: Dockerfile
    workload_type: Service
    replicas: 1
    env:
      HOST: 0.0.0.0
      PORT: "8000"
      SOCIALSCRAPE_CACHE_PATH: /data/cache.sqlite3
      SOCIALSCRAPE_PORTAL_PATH: /data/portal.sqlite3
      SOCIALSCRAPE_LOG_LEVEL: INFO
    secrets:
      socialscrape-portal-encryption:
        SOCIALSCRAPE_PORTAL_ENCRYPTION_KEY: fernet_key
    volumes:
      - name: data
        path: /data
    ports:
      # The live port uses custom_domain: scrape.mimic.host and TLS. The
      # Stackfile schema cannot preserve custom_domain, so publish code with
      # `stackdome create release --stack socialscrape-app --wait` using the
      # saved stack definition. Applying this file would clear the domain;
      # Stackdome blocks hostname changes on an already-public live port.
      - name: http
        port: 8000
        protocol: HTTP
        public: true
        tls: true
        subdomain: ""
volumes:
  data:
    size: 1Gi
    access_mode: ReadWriteOnce
