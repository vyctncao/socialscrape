name: socialscrape-app
resources:
  api:
    build:
      repo: https://github.com/vyctncao/socialscrape.git
      branch: main
      context: .
      dockerfile: Dockerfile
    workload_type: Service
    replicas: 1
    env:
      HOST: 0.0.0.0
      PORT: "8000"
      SOCIALSCRAPE_CACHE_PATH: /data/cache.sqlite3
      SOCIALSCRAPE_PORTAL_PATH: /data/portal.sqlite3
      SOCIALSCRAPE_LOG_LEVEL: INFO
    secrets:
      socialscrape-portal-encryption:
        SOCIALSCRAPE_PORTAL_ENCRYPTION_KEY: fernet_key
    volumes:
      - name: data
        path: /data
    ports:
      - name: http
        port: 8000
        protocol: HTTP
        public: true
        subdomain: ""
volumes:
  data:
    size: 1Gi
    access_mode: ReadWriteOnce
