[project]
name = "socialscrape"
version = "0.1.0"
description = "Self-hosted, ScrapeCreators-compatible API for YouTube, TikTok, Instagram and the Facebook, TikTok and Google ad libraries, powered by yt-dlp"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp[default,curl-cffi]>=2026.8.19",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.20",
    "cryptography>=46",
]

[project.optional-dependencies]
# faster-whisper 1.2.1 opens audio with av.open(metadata_errors=...), which PyAV 19 removed (TypeError at run time).
whisper = ["faster-whisper>=1.0", "av<19"]
mlx = ["mlx-whisper>=0.4"]

[dependency-groups]
dev = ["pytest>=8", "httpx2>=2.13"]

[project.scripts]
socialscrape = "socialscrape.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real platforms over the network (deselect with -m 'not live')"]
